[project]
name = "ds-star"
version = "0.1.0"
description = "My Implementation of DS-STAR paper by Google Research"
authors = [
    {name = "MatinKhajavi",email = "mat.khajavi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "plotly (>=6.5.0,<7.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "google-genai (>=1.50.1,<2.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
